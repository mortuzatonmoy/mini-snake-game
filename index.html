<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>🐍 Mini Snake</h1>

    <div class="stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
      <div class="stat"><span>Level</span><strong id="level">1</strong></div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>

      <div id="overlay" class="overlay">
        <h2 id="overlay-title">Ready?</h2>
        <p id="overlay-text">Press Start or Space to play</p>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn primary">Start</button>
      <button id="pauseBtn" class="btn" disabled>Pause</button>
      <button id="restartBtn" class="btn">Restart</button>
    </div>

    <div class="dpad" aria-label="Touch controls">
      <button data-dir="up" class="pad up">▲</button>
      <button data-dir="left" class="pad left">◀</button>
      <button data-dir="down" class="pad down">▼</button>
      <button data-dir="right" class="pad right">▶</button>
    </div>

    <p class="help">Arrow keys / WASD to move · Space to pause · Enter to restart</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
